<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Editor — страницы</title>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
  <style>
    :root{
      --bg:#f5f6f8; --card:#fff; --text:#17181b; --muted:#737780;
      --line:#e5e7eb; --accent:#111827; --danger:#e5484d;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .app{min-height:100vh;display:flex;flex-direction:column}
    header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:18px;position:sticky;top:0;z-index:10}
    .logo{display:inline-block;font-size:20px;font-weight:750;letter-spacing:-.4px;text-decoration:none;cursor:pointer}
    .logo span{color:#8a8f98;font-weight:500}
    .file-name{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .spacer{flex:1}
    button{border:0;border-radius:11px;padding:10px 15px;font:inherit;font-size:14px;font-weight:650;cursor:pointer;transition:.15s}
    button:disabled{opacity:.45;cursor:not-allowed}
    .secondary{background:#f0f1f3;color:#222}
    .secondary:hover:not(:disabled){background:#e7e8eb}
    .primary{background:#111827;color:white}
    .primary:hover:not(:disabled){background:#272d38}
    .danger{background:#fff0f0;color:var(--danger)}
    .danger:hover:not(:disabled){background:#ffe3e3}
    main{width:min(1180px,calc(100% - 40px));margin:28px auto 50px;flex:1}
    .drop{background:var(--card);border:1.5px dashed #cfd3da;border-radius:20px;padding:58px 24px;text-align:center;cursor:pointer;transition:.15s}
    .drop:hover,.drop.drag{border-color:#777f8d;background:#fafafa}
    .drop-icon{font-size:42px;margin-bottom:12px}
    .drop h1{font-size:24px;margin:0 0 8px;letter-spacing:-.5px}
    .drop p{color:var(--muted);margin:0 0 20px;font-size:14px}
    #fileInput{display:none}
    .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
    .counter{font-size:14px;color:var(--muted);margin-right:5px}
    .hint{font-size:13px;color:var(--muted);margin-left:auto}
    .pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
    .page{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:.15s}
    .page.selected{border:2px solid #111827;padding:9px}
    .page.removed{opacity:.38;filter:grayscale(1)}
    .thumb{background:#eef0f3;border-radius:10px;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
    .thumb canvas{max-width:100%;max-height:100%;display:block}
    .badge{position:absolute;left:8px;top:8px;background:rgba(17,24,39,.88);color:#fff;border-radius:8px;padding:4px 7px;font-size:11px;font-weight:700}
    .page-footer{display:flex;align-items:center;justify-content:space-between;padding:9px 2px 1px;gap:8px}
    .page-num{font-size:13px;color:var(--muted)}
    .delete-page{padding:7px 9px;border-radius:9px;font-size:12px}
    .empty{background:#fff;border-radius:18px;padding:35px;text-align:center;color:var(--muted)}
    .status{margin-top:16px;color:var(--muted);font-size:13px;text-align:center;min-height:20px}
    .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
    .modal{background:#fff;border-radius:18px;padding:24px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
    .modal h2{margin:0 0 8px;font-size:20px}.modal p{color:var(--muted);font-size:14px;line-height:1.5}
    .modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
    @media(max-width:600px){header{padding:0 15px}.file-name{display:none}main{width:calc(100% - 24px);margin-top:18px}.pages{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hint{width:100%;margin-left:0}}

    .page{position:relative;background:rgba(255,255,255,.92);border-color:#dce8f1;box-shadow:0 6px 18px rgba(43,82,112,.055)}
    .page::after{content:"✧";position:absolute;top:13px;right:14px;color:#b4d0e4;opacity:0;transform:scale(.7);transition:.18s;pointer-events:none}
    .page:hover{border-color:#b4d1e4;box-shadow:0 12px 26px rgba(43,82,112,.12);transform:none}

    .page.selected{border:2px solid #6297bc;box-shadow:0 0 0 3px rgba(110,164,201,.15)}
    .thumb{background:linear-gradient(145deg,#eaf2f8,#f7fbff);border:1px solid #e2ebf2}
    .badge{background:rgba(58,100,134,.9);box-shadow:0 3px 10px rgba(38,73,102,.15)}
    .modal-back{background:rgba(26,54,76,.34);backdrop-filter:blur(4px)}
    .modal{border:1px solid #dae8f2;box-shadow:0 24px 70px rgba(29,62,88,.2)}
    .empty{background:#f7fbfe;border:1px dashed #d2e3ef;color:#607c93}
    @media(prefers-reduced-motion:reduce){button,.page,.page::after{transition:none!important}}

    body[data-season="spring"] .drop-scene--spring,body[data-season="summer"] .drop-scene--summer,body[data-season="autumn"] .drop-scene--autumn{display:block}
    body[data-season="spring"] .drop-scene{opacity:.72}
    body[data-season="summer"] .drop-scene{opacity:.88;filter:drop-shadow(0 8px 12px rgba(45,123,128,.14))}
    body[data-season="autumn"] .drop-scene{opacity:.88;filter:drop-shadow(0 9px 12px rgba(88,55,37,.18))}
    body[data-season="spring"] .page::after{content:"✿";color:#c49caf}body[data-season="summer"] .page::after{content:"☼";color:#c5a44e}body[data-season="autumn"] .page::after{content:"❧";color:#b27a52}
    body[data-season="spring"] .drop::before{content:"✿　✧　❀";color:#b58da0}
    body[data-season="summer"] .drop::before{content:"☼　✦　〰";color:#4e9fa4}
    body[data-season="autumn"]{--bg:#f3e8d8;--line:#e4cfb5;--accent:#684432;--danger:#a56343;background:radial-gradient(ellipse at 20% 0%,#e9d2b7,transparent 38%),linear-gradient(145deg,#f1e3cf,#fbf5eb 58%,#ead7bd)}
    body[data-season="autumn"]::before{content:"❧";color:#986c4d;opacity:.14}body[data-season="autumn"]::after{content:"☕";font-size:clamp(100px,15vw,185px);color:#86543a;opacity:.12}
    body[data-season="autumn"] header{background:rgba(255,249,239,.92);border-color:#e0c8aa;box-shadow:0 5px 22px rgba(93,57,36,.1)}
    body[data-season="autumn"] .logo{color:#50372a}body[data-season="autumn"] .logo span{color:#95765b}
    body[data-season="autumn"] .primary{background:linear-gradient(145deg,#80533e,#5e3c2e);box-shadow:0 5px 14px rgba(87,55,38,.24)}body[data-season="autumn"] .primary:hover:not(:disabled){background:#4e3227}
    body[data-season="autumn"] .drop{border:1px solid #d9bea0;background:linear-gradient(145deg,#fff9ef,#f5e8d5);box-shadow:0 18px 42px rgba(92,59,39,.13)}body[data-season="autumn"] .drop:hover,body[data-season="autumn"] .drop.drag{border-color:#b88661;background:#fbf2e6}
    body[data-season="autumn"] .drop h1{color:#563a2b}body[data-season="autumn"] .drop p{color:#826b56}
    body[data-season="autumn"] .toolbar{background:rgba(250,242,229,.92);border-color:#e4cfb5}
    body[data-season="autumn"] .page{background:#fff9ef;border-color:#e3cfb8;box-shadow:0 6px 18px rgba(92,59,39,.08)}body[data-season="autumn"] .page:hover{border-color:#c99b75;box-shadow:0 12px 26px rgba(92,59,39,.16)}
    body[data-season="autumn"] .page.selected{border-color:#9a6747;box-shadow:0 0 0 3px rgba(154,103,71,.17)}body[data-season="autumn"] .badge{background:rgba(89,57,41,.92)}
    body[data-season="autumn"] .danger{background:#f4e5d8;color:#89553d;border-color:#e4c9b2}body[data-season="autumn"] .danger:hover:not(:disabled){background:#ecd6c3}
    @media(max-width:600px){.drop-scene{width:100px;height:76px;right:6px;top:8px;opacity:.42}body[data-season="spring"] .drop-scene{opacity:.3}}
    body[data-season="spring"] .secondary{background:#edf2e7;color:#526a4d;border-color:#dce5d2}
    body[data-season="summer"] .secondary{background:#e6f2ef;color:#3d777a;border-color:#cfe5e1}
    body[data-season="autumn"] .secondary{background:#f0e1ce;color:#765039;border-color:#e1c9ad}
    body[data-season="spring"] button:focus-visible{outline-color:#88a878}body[data-season="summer"] button:focus-visible{outline-color:#56aeb1}body[data-season="autumn"] button:focus-visible{outline-color:#ad7952}

    .toolbar{align-items:center;gap:9px}.toolbar button{white-space:nowrap}
    .page{cursor:grab}.page:active{cursor:grabbing}.page.dragging{opacity:.42;border-style:dashed}
    .page.duplicated{border-style:dashed}
    .blank-thumb{background:linear-gradient(145deg,#fff,#f5f8fa);border:1px dashed #bacbd8}
    .blank-label{color:#7a8e9e;font-size:13px;letter-spacing:.04em}
    button:not(:disabled):hover{transform:none!important}
    .page:hover{transform:none!important}
    .page::after{content:none!important;display:none!important}
    @media(max-width:600px){.toolbar button{flex:1 1 calc(50% - 10px);white-space:normal}.toolbar .hint{order:10}}

  
    /* Keep button hitboxes fixed: no transition, movement, or hover shadow. */
    button,button::before,button::after{transition:none!important;animation:none!important;transform:none!important;filter:none!important}
    button:not(:disabled):hover,button:focus-visible,button:active{opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;box-shadow:none!important}
    .page,.page::after{transition:none!important;animation:none!important}
    .page:hover{transform:none!important;filter:none!important}

</style>
</head>
<body>
<div class="app">
<header>
  <div class="winter-garland" aria-hidden="true"></div>
  <a class="logo" href="index.html" aria-label="Вернуться в главное меню">PDF <span>Editor</span></a>
  <div class="file-name" id="fileName"></div>
  <div class="spacer"></div>
  <button class="secondary" id="newBtn" disabled>Другой PDF</button>
  <button class="primary" id="downloadBtn" disabled>Скачать PDF</button>
</header>

<main>
  <section class="drop" id="drop">
    <svg class="drop-scene drop-scene--spring" viewBox="0 0 180 130" aria-hidden="true"><path d="M20 112Q74 70 150 23M67 80Q38 69 38 48q25 4 30 32m35-36q-3-23 15-34 12 22-13 39" fill="none" stroke="#819b75" stroke-width="4" stroke-linecap="round"/><g fill="#e6bdcb" stroke="#fff" stroke-width="2"><circle cx="91" cy="62" r="9"/><circle cx="103" cy="65" r="9"/><circle cx="97" cy="76" r="9"/><circle cx="97" cy="67" r="3" fill="#e4c987"/></g></svg>
    <svg class="drop-scene drop-scene--summer" viewBox="0 0 180 130" aria-hidden="true"><circle cx="126" cy="37" r="22" fill="#efc66e"/><path d="M5 84q24-14 48 0t48 0 48 0 31 0v46H5Z" fill="#64b8bb"/><path d="M5 98q24-14 48 0t48 0 48 0 31 0" fill="none" stroke="#f4fbf5" stroke-width="4" stroke-linecap="round"/><g stroke="#dfa94e" stroke-width="3" stroke-linecap="round"><path d="M126 5v-8m0 82v-8m-32-34h-8m80 0h-8"/></g></svg>
    <svg class="drop-scene drop-scene--autumn" viewBox="0 0 180 130" aria-hidden="true"><path d="M46 58h83l-11 53q-2 8-10 8H68q-8 0-10-8Z" fill="#ad704e" stroke="#78503c" stroke-width="4"/><path d="M52 65h72" stroke="#57382d" stroke-width="7"/><path d="M129 70h14q18 0 13 22-3 9-14 9" fill="none" stroke="#78503c" stroke-width="7"/><path d="M37 119h130" stroke="#937152" stroke-width="5" stroke-linecap="round"/><path d="M68 47q-7-16 5-29m32 29q-5-16 8-27" fill="none" stroke="#a78b6c" stroke-width="3" stroke-linecap="round"/><path d="M24 43Q6 25 24 9q21 13 0 34Zm132-2q-9-17 8-29 19 14-1 29Z" fill="#9a7956"/></svg>
    <div class="drop-icon">📄</div>
    <h1>Загрузите PDF</h1>
    <p>Выберите файл или перетащите его сюда. Ничего не отправляется на сервер.</p>
    <button class="primary" id="chooseBtn">Выбрать PDF</button>
    <input id="fileInput" type="file" accept="application/pdf,.pdf">
  </section>

  <section id="editor" hidden>
    <div class="toolbar">
      <span class="counter" id="counter"></span>
      <button class="secondary" id="selectAll">Выбрать все</button>
      <button class="secondary" id="clearSelection">Снять выделение</button>
      <button class="secondary" id="rotateLeft" title="Повернуть выделенные страницы влево">↶ Повернуть</button>
      <button class="secondary" id="rotateRight" title="Повернуть выделенные страницы вправо">↷ Повернуть</button>
      <button class="secondary" id="duplicateSelected">Дублировать</button>
      <button class="secondary" id="addBlank">＋ Пустая страница</button>
      <button class="secondary" id="restoreDeleted">Восстановить удалённые</button>
      <button class="danger" id="deleteSelected">Удалить выбранные</button>
      <span class="hint">Перетаскивайте карточки мышью, чтобы изменить порядок страниц.</span>
    </div>
    <div class="pages" id="pages"></div>
    <div class="status" id="status"></div>
  </section>
</main>
</div>

<div class="modal-back" id="modal">
  <div class="modal">
    <h2>Добавить белые страницы?</h2>
    <p id="modalText"></p>
    <div class="modal-actions">
      <button class="secondary" id="cancelModal">Отмена</button>
      <button class="primary" id="confirmModal">Продолжить</button>
    </div>
  </div>
</div>

<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

  const { PDFDocument, rgb, degrees } = PDFLib;
  const $ = id => document.getElementById(id);

  let sourceBytes = null;
  let sourcePdf = null;
  let previewPdf = null;
  let pages = []; // ordered page operations; originals, duplicates, blanks, rotation, deletion
  let nextPageId = 1;
  let draggedPageId = null;
  let suppressCardClick = false;
  let originalCount = 0;
  let pageSize = null;
  let pendingDeletion = null;

  $("chooseBtn").onclick = () => $("fileInput").click();
  $("drop").onclick = e => { if(e.target.id !== "chooseBtn") $("fileInput").click(); };
  $("fileInput").onchange = e => e.target.files[0] && loadFile(e.target.files[0]);

  ["dragenter","dragover"].forEach(ev => $("drop").addEventListener(ev, e => {e.preventDefault(); $("drop").classList.add("drag")}));
  ["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, e => {e.preventDefault(); $("drop").classList.remove("drag")}));
  $("drop").addEventListener("drop", e => {
    const f = e.dataTransfer.files[0];
    if(f && f.type === "application/pdf") loadFile(f);
  });

  $("newBtn").onclick = () => location.reload();
  $("selectAll").onclick = () => { pages.filter(p => !p.deleted).forEach(p => p.selected = true); render(); };
  $("clearSelection").onclick = () => { pages.forEach(p => p.selected = false); render(); };
  $("rotateLeft").onclick = () => rotateSelected(-90);
  $("rotateRight").onclick = () => rotateSelected(90);
  $("duplicateSelected").onclick = () => {
    const selected = pages.filter(p => !p.deleted && p.selected);
    if(!selected.length) return;
    selected.forEach(p => {
      p.selected = false;
      const copy = {...p, id:nextPageId++, selected:false, deleted:false, duplicate:true};
      pages.splice(pages.indexOf(p)+1, 0, copy);
    });
    render();
  };
  $("addBlank").onclick = () => { pages.push({id:nextPageId++, originalIndex:null, blank:true, selected:false, deleted:false, rotation:0}); render(); };
  $("restoreDeleted").onclick = () => { pages.forEach(p => { if(p.deleted){p.deleted=false; p.selected=false;} }); render(); };
  $("deleteSelected").onclick = () => {
    const selected = pages.filter(p => p.selected && !p.deleted);
    if(!selected.length) return;
    selected.forEach(p => p.deleted = true);
    pages.forEach(p => p.selected = false);
    render();
  };
  $("downloadBtn").onclick = buildPdf;

  async function loadFile(file){
    try{
      setStatus("Открываю PDF…");
      sourceBytes = new Uint8Array(await file.arrayBuffer());
      sourcePdf = await PDFDocument.load(sourceBytes);
      previewPdf = await pdfjsLib.getDocument({data:sourceBytes.slice()}).promise;
      originalCount = sourcePdf.getPageCount();
      const first = sourcePdf.getPage(0);
      pageSize = { width:first.getWidth(), height:first.getHeight() };
      nextPageId=1;
      pages = Array.from({length:originalCount}, (_,i)=>({id:nextPageId++, originalIndex:i, rotation:0, deleted:false, selected:false}));
      $("fileName").textContent = file.name;
      $("drop").hidden = true;
      $("editor").hidden = false;
      $("newBtn").disabled = false;
      $("downloadBtn").disabled = false;
      await render();
      setStatus("");
    }catch(err){
      alert("Не удалось открыть PDF. Возможно, файл повреждён или защищён.");
      console.error(err);
    }
  }

  async function render(){
    const container = $("pages");
    container.innerHTML = "";
    const alive = pages.filter(p=>!p.deleted);
    const removed = pages.length - alive.length;
    const selectedCount = alive.filter(p=>p.selected).length;
    $("counter").textContent = `${alive.length} ${plural(alive.length,"страница","страницы","страниц")} · выделено: ${selectedCount} · удалено: ${removed}`;
    $("deleteSelected").disabled = selectedCount===0;
    $("duplicateSelected").disabled = selectedCount===0;
    $("rotateLeft").disabled = selectedCount===0;
    $("rotateRight").disabled = selectedCount===0;
    $("restoreDeleted").disabled = removed===0;
    $("clearSelection").disabled = selectedCount===0;

    if(!alive.length){
      container.innerHTML = '<div class="empty">Все страницы удалены. Восстановите страницы или добавьте пустую страницу.</div>';
      return;
    }

    const loading = alive.some(p=>!p.blank) ? previewPdf : null;
    for(const [position,p] of alive.entries()){
      const card = document.createElement("div");
      card.className = "page" + (p.selected ? " selected":"") + (p.duplicate ? " duplicated":"");
      card.draggable = true;
      card.dataset.pageId = p.id;
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      const badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = p.blank ? "Пустая" : String(p.originalIndex + 1) + (p.duplicate ? " · копия" : "");
      thumb.appendChild(badge);
      card.appendChild(thumb);

      const footer = document.createElement("div");
      footer.className = "page-footer";
      const num = document.createElement("span");
      num.className = "page-num";
      num.textContent = p.blank ? `Пустая страница · позиция ${position+1}` : `Страница ${p.originalIndex+1} · позиция ${position+1}${p.rotation ? ` · ${p.rotation}°` : ""}`;
      const del = document.createElement("button");
      del.className = "danger delete-page";
      del.textContent = "Удалить";
      del.onclick = (e)=>{e.stopPropagation(); p.deleted=true; p.selected=false; render()};
      footer.append(num,del);
      card.appendChild(footer);

      card.onclick = ()=>{if(suppressCardClick) return; p.selected=!p.selected; render()};
      card.addEventListener("dragstart",e=>{draggedPageId=p.id; suppressCardClick=true; card.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",String(p.id));});
      card.addEventListener("dragover",e=>{e.preventDefault(); e.dataTransfer.dropEffect="move";});
      card.addEventListener("drop",e=>{
        e.preventDefault();
        const from=pages.findIndex(x=>x.id===draggedPageId), to=pages.findIndex(x=>x.id===p.id);
        if(from<0||to<0||from===to) return;
        const [moved]=pages.splice(from,1); pages.splice(to,0,moved); render();
      });
      card.addEventListener("dragend",()=>{card.classList.remove("dragging"); draggedPageId=null; setTimeout(()=>suppressCardClick=false,0);});
      container.appendChild(card);

      if(p.blank){
        thumb.classList.add("blank-thumb");
        thumb.style.aspectRatio=(p.rotation%180) ? "4 / 3" : "3 / 4";
        const blankLabel=document.createElement("span"); blankLabel.className="blank-label"; blankLabel.textContent="Пустая страница"; thumb.appendChild(blankLabel);
        continue;
      }
      try{
        const pg = await loading.getPage(p.originalIndex+1);
        const rotation=((pg.rotate||0)+p.rotation+360)%360;
        const baseViewport=pg.getViewport({scale:1,rotation});
        const scale=Math.min(1,160/baseViewport.width);
        const vp=pg.getViewport({scale,rotation});
        const canvas=document.createElement("canvas"); canvas.width=Math.ceil(vp.width); canvas.height=Math.ceil(vp.height);
        await pg.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;
        thumb.appendChild(canvas);
      }catch(e){console.error(e);}
    }
  }

  function rotateSelected(delta){
    const selected=pages.filter(p=>!p.deleted&&p.selected);
    if(!selected.length)return;
    selected.forEach(p=>p.rotation=((p.rotation||0)+delta+360)%360);
    render();
  }

  function setStatus(text){ $("status").textContent=text; }

  async function buildPdf(){
    const alive = pages.filter(p=>!p.deleted);
    if(!alive.length){ alert("Нельзя создать PDF без страниц."); return; }

    const remainder = alive.length % 4;
    const blanks = remainder === 0 ? 0 : 4 - remainder;

    if(blanks){
      pendingDeletion = {alive, blanks};
      $("modalText").textContent =
        `Сейчас останется ${alive.length} ${plural(alive.length,"страница","страницы","страниц")}. ` +
        `Чтобы количество стало кратно 4, в конец будут добавлены ${blanks} ${plural(blanks,"белая страница","белые страницы","белых страниц")} ` +
        `размером ${Math.round(pageSize.width)} × ${Math.round(pageSize.height)} pt.`;
      $("modal").style.display="flex";
      return;
    }
    await actuallyBuild(alive,0);
  }

  $("cancelModal").onclick = () => { $("modal").style.display="none"; pendingDeletion=null; };
  $("confirmModal").onclick = async () => {
    $("modal").style.display="none";
    if(pendingDeletion){
      const x=pendingDeletion; pendingDeletion=null;
      await actuallyBuild(x.alive,x.blanks);
    }
  };

  async function actuallyBuild(alive, blanks){
    try{
      setStatus("Собираю новый PDF…");
      $("downloadBtn").disabled=true;
      const out = await PDFDocument.create();
      const copied = await out.copyPages(sourcePdf, alive.filter(p=>!p.blank).map(p=>p.originalIndex));
      let copiedIndex=0;
      for(const entry of alive){
        if(entry.blank){const landscape=entry.rotation%180!==0; out.addPage(landscape?[pageSize.height,pageSize.width]:[pageSize.width,pageSize.height]); continue;}
        const page=copied[copiedIndex++];
        if(entry.rotation){const current=page.getRotation().angle||0; page.setRotation(degrees((current+entry.rotation)%360));}
        out.addPage(page);
      }
      for(let i=0;i<blanks;i++){
        const blank=out.addPage([pageSize.width,pageSize.height]);
        blank.drawRectangle({x:0,y:0,width:pageSize.width,height:pageSize.height,color:rgb(1,1,1)});
      }
      const bytes = await out.save();
      const blob = new Blob([bytes],{type:"application/pdf"});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      const base=($("fileName").textContent||"document.pdf").replace(/\.pdf$/i,"");
      a.download=base+"-edited.pdf";
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      setStatus(`Готово: ${alive.length + blanks} страниц.`);
    }catch(err){
      console.error(err);
      alert("Не удалось создать PDF.");
      setStatus("Ошибка при создании PDF.");
    }finally{
      $("downloadBtn").disabled=false;
    }
  }


  document.addEventListener("keydown",e=>{
    const tag=(e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||e.target.isContentEditable)return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="a"&&!$("editor").hidden){e.preventDefault(); $("selectAll").click();}
    if(e.key==="Delete"&&!$("editor").hidden&&!$("deleteSelected").disabled){e.preventDefault(); $("deleteSelected").click();}
  });

  function plural(n,a,b,c){
    n=Math.abs(n)%100; const n1=n%10;
    if(n>10&&n<20)return c;
    if(n1>1&&n1<5)return b;
    if(n1===1)return a;
    return c;
  }
</script>
<script>
(()=>{
  const allowed=['winter','spring','summer','autumn'];
  const requested=new URLSearchParams(location.search).get('season');
  let season=allowed.includes(requested)?requested:'';
  if(!season){
    const now=new Date(), month=now.getMonth()+1, day=now.getDate();
    if((month===11&&day>=15)||month===12||month===1||(month===2&&day<=15)) season='winter';
    else if((month===2&&day>=16)||month===3||month===4||(month===5&&day<=15)) season='spring';
    else if((month===5&&day>=16)||month===6||month===7||month===8) season='summer';
    else season='autumn';
  }
  document.body.dataset.season=season;
})();
</script>
</body>
